<title>Machines de la Digital Factory</title>
<style>@font-face{font-family:Poppins;src:url('assets/poppins-regular.ttf') format('truetype');font-weight:400 500;font-display:swap}@font-face{font-family:Poppins;src:url('assets/poppins-semibold.ttf') format('truetype');font-weight:600 900;font-display:swap}</style>
<style>
/* Mise en page : en-tête bleu foncé collant, bandeaux en dégradé de marque, cartes blanches sur fond clair ; tout passe sur une colonne au téléphone.
   Charte Digital Factory : bleu foncé, bleu, violet, fond clair, Poppins. Un seul thème clair, voulu par la charte. */
:root {
  --navy: #2f3a48;
  --blue: #5b60a8;
  --violet: #8c4292;
  --bg: #f4f5f7;
  --card: #ffffff;
  --line: #e0e0e0;
  --text: #333333;
  --muted: #5a6270;
  --on-dark: #ffffff;
  --ok: #2e7d32;
  --gradient: linear-gradient(120deg, #2f3a48 0%, #5b60a8 62%, #8c4292 100%);
  --font: "Poppins", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(47, 58, 72, 0.06);
  --shadow-hover: 0 12px 28px rgba(47, 58, 72, 0.14);
  --header-h: 64px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--navy);
}
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
svg { flex: none; }
a { color: var(--blue); }
a:hover { color: var(--navy); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
h1:focus, main:focus { outline: none; }
h1, h2, h3, h4 { margin: 0; color: var(--navy); line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.9em; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--navy); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.wrap {
  width: 100%;
  max-width: 1200px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) {
  .wrap {
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
}

.skip {
  position: fixed; left: 12px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 50;
  transform: translateY(-200%);
  background: var(--card); color: var(--navy); border: 2px solid var(--blue); border-radius: 10px;
  padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
}
.skip:focus { transform: none; }

/* En-tête */
.site-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--navy);
  color: var(--on-dark);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--header-h); padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--on-dark); text-decoration: none; min-width: 0; }
.brand:hover { color: var(--on-dark); }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--on-dark); color: var(--navy); display: grid; place-items: center; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-text strong { font-size: 17px; font-weight: 700; }
.brand-text span { font-size: 12.5px; }
.header-nav { display: flex; align-items: center; gap: 6px; }
.hnav {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  border-radius: 999px; border: 1.5px solid transparent;
  color: var(--on-dark); text-decoration: none; font-size: 15px; font-weight: 600;
}
.hnav:hover { color: var(--on-dark); background: rgba(255, 255, 255, 0.1); }
.hnav[aria-current="page"] { border-color: rgba(255, 255, 255, 0.6); }
.count {
  display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 999px; background: var(--violet); color: var(--on-dark); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
@media (max-width: 520px) {
  .brand-text span, .hnav-home, .hnav-label { display: none; }
  .hnav { padding: 0 12px; }
}

/* Bandeaux */
.hero, .subhero, .fiche-hero { background: var(--gradient); color: var(--on-dark); }
.hero h1, .subhero h1, .fiche-hero h1, .hero h2 { color: var(--on-dark); }
.hero-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px; padding-block: 48px 56px; }
.hero-text { flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 13.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.12; font-weight: 700; }
.lead { font-size: clamp(16.5px, 2vw, 19px); line-height: 1.6; max-width: 62ch; }
.stats { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.stats li {
  display: inline-flex; align-items: baseline; gap: 7px; padding: 8px 16px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.32); font-size: 15px;
}
.stats strong { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.mosaic { display: grid; grid-template-columns: repeat(3, 84px); gap: 14px; padding-bottom: 26px; }
.mosaic span {
  width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; color: var(--on-dark);
  background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.3);
}
.mosaic span:nth-child(3n + 2) { transform: translateY(26px); }
@media (max-width: 860px) { .mosaic { display: none; } }

.subhero-inner, .fiche-hero-inner { display: flex; flex-direction: column; gap: 22px; padding-block: 22px 40px; }
.back {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px 0 12px;
  border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: var(--on-dark); text-decoration: none; font-size: 15px; font-weight: 600;
}
.back:hover { color: var(--on-dark); background: rgba(255, 255, 255, 0.22); }
.subhero-id { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.subhero-titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.subhero h1 { font-size: clamp(28px, 4.4vw, 40px); line-height: 1.15; font-weight: 700; }
.id-tile {
  flex: none; width: 72px; height: 72px; border-radius: 20px; background: var(--card); color: var(--navy);
  display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}
.id-tile-violet { color: var(--violet); }
.id-tile-xl { width: 104px; height: 104px; border-radius: 26px; }

/* Fiche machine */
.fiche-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager { display: flex; align-items: center; gap: 8px; }
.pager-btn {
  width: 44px; height: 44px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); color: var(--on-dark);
  display: inline-flex; align-items: center; justify-content: center;
}
.pager-btn:hover { color: var(--on-dark); background: rgba(255, 255, 255, 0.24); }
.pager-pos { font-size: 15px; font-weight: 600; padding: 0 6px; font-variant-numeric: tabular-nums; }
.fiche-id { display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
.fiche-titles { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.family-badge { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: var(--violet); color: var(--on-dark); font-size: 13px; font-weight: 600; }
.fiche-hero h1 { font-size: clamp(30px, 4.6vw, 42px); line-height: 1.15; font-weight: 700; }
.h1-sigle { font-size: 0.5em; font-weight: 600; vertical-align: middle; padding: 2px 10px; border-radius: 8px; border: 1.5px solid rgba(255, 255, 255, 0.6); margin-left: 4px; }
.fiche-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.btn-fav {
  display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 999px;
  border: 1.5px solid rgba(255, 255, 255, 0.75); background: transparent; color: var(--on-dark);
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-fav:hover { background: rgba(255, 255, 255, 0.12); }
.btn-fav[aria-pressed="true"] { background: var(--card); color: var(--violet); border-color: var(--card); }
@media (max-width: 560px) {
  .id-tile-xl { width: 76px; height: 76px; border-radius: 20px; }
  .id-tile-xl svg { width: 42px; height: 42px; }
  .fiche-id { gap: 18px; }
}

.jumpbar, .chipbar { background: var(--card); border-bottom: 1px solid var(--line); }
.jumps, .chips { display: flex; gap: 8px; padding-block: 10px; }
.jumps { overflow-x: auto; scrollbar-width: none; }
.jumps::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
.chips { flex-wrap: wrap; }
.chipbar-label { padding-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
@media (max-width: 700px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
}
.jump, .chip {
  flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--navy);
  font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer;
}
.jump:hover, .chip:hover { border-color: var(--blue); color: var(--navy); }
.chip[aria-current="page"] { background: var(--blue); border-color: var(--blue); color: var(--on-dark); }

/* Contenu */
#app { min-height: 60vh; display: block; }
.page { display: flex; flex-direction: column; gap: 52px; padding-block: 40px 64px; }
.block { display: flex; flex-direction: column; gap: 20px; }
.section { scroll-margin-top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 16px); }
.block-head { display: flex; flex-direction: column; gap: 6px; }
.block-head h2 { font-size: clamp(22px, 3vw, 27px); font-weight: 700; }
.block-head p { color: var(--muted); font-size: 16px; max-width: 65ch; }

.lift { transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
@media (hover: hover) {
  .lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--blue); }
}

.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile {
  display: flex; flex-direction: column; gap: 10px; padding: 14px; min-height: 128px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--navy);
}
.tile:hover { color: var(--navy); }
.tile-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); color: var(--violet); display: grid; place-items: center; }
.tile-text { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile-name { font-size: 14.5px; font-weight: 600; line-height: 1.3; hyphens: auto; overflow-wrap: break-word; }
.tile-count { margin-top: auto; font-size: 13px; color: var(--muted); }
@media (max-width: 560px) {
  .tile { min-height: 112px; padding: 12px 14px; gap: 8px; }
  .tile-ic { width: 38px; height: 38px; border-radius: 10px; }
  .tile-ic svg { width: 22px; height: 22px; }
  .tile-name { font-size: 14px; }
}

.family { display: flex; flex-direction: column; gap: 14px; }
.family-head { display: flex; align-items: center; gap: 14px; }
.family-head h3 { font-size: 13.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet); }
.family-head .rule { flex: 1; height: 1px; background: var(--line); }
.machines { display: flex; flex-direction: column; gap: 30px; }
.grid-machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.mcard {
  display: flex; flex-direction: column; gap: 14px; padding: 20px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  text-decoration: none; color: var(--text);
}
.mcard:hover { color: var(--text); }
.mcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mcard-ic { width: 56px; height: 56px; border-radius: 14px; background: var(--navy); color: var(--on-dark); display: grid; place-items: center; flex: none; }
.mcard-num { font-size: 14px; font-weight: 700; color: var(--violet); font-variant-numeric: tabular-nums; }
.mcard-main { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mcard-body { display: flex; flex-direction: column; gap: 6px; }
.mcard-name { font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--navy); }
.sigle { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.mcard-short { font-size: 14.5px; line-height: 1.55; color: var(--muted); }
.mcard-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; color: var(--blue); }
.go { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.fav-flag { display: inline-flex; align-items: center; gap: 6px; color: var(--violet); font-size: 13px; }
@media (max-width: 560px) {
  .mcard { flex-direction: row; align-items: flex-start; gap: 14px; padding: 16px; }
  .mcard-top { flex-direction: column; align-items: center; gap: 6px; }
  .mcard-ic { width: 48px; height: 48px; border-radius: 12px; }
  .mcard-ic svg { width: 26px; height: 26px; }
  .mcard-main { gap: 10px; }
  .mcard-name { font-size: 16.5px; }
}

.panel {
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 24px;
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.panel h3 { font-size: 18px; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 10px; }
.panel p { font-size: 16px; line-height: 1.65; }
.duo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
@media (max-width: 560px) { .panel { padding: 18px; } }

.skills { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.skills li {
  display: inline-flex; align-items: flex-start; gap: 8px; max-width: 100%; padding: 10px 16px; border-radius: 14px;
  background: var(--card); border: 1.5px solid var(--line); font-size: 15px; font-weight: 500; line-height: 1.45; color: var(--navy);
}
.skills li svg { color: var(--violet); margin-top: 2px; }

.safety-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.safety-list li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.6; }
.safety-list li::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 10px; border-radius: 999px; background: var(--blue); }

.grid-real { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.rcard { display: flex; flex-direction: column; gap: 12px; padding: 20px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); min-width: 0; }
.rcard-machine { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 600; color: var(--blue); text-decoration: none; }
.rcard-machine .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--navy); color: var(--on-dark); display: grid; place-items: center; }
.rcard h3 { font-size: 18px; font-weight: 600; line-height: 1.35; }
.rcard p { font-size: 15px; line-height: 1.6; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--violet); color: var(--violet); font-size: 12.5px; font-weight: 600; line-height: 1.4; }

.btn, .btn-outline {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 12px; font: inherit; font-size: 14.5px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn { background: var(--blue); border: 1.5px solid var(--blue); color: var(--on-dark); align-self: flex-start; }
.btn:hover { background: var(--navy); border-color: var(--navy); color: var(--on-dark); }
.btn-outline { background: var(--card); border: 1.5px solid var(--blue); color: var(--blue); }
.btn-outline:hover { background: var(--blue); color: var(--on-dark); }
.rcard .btn-outline { margin-top: auto; }

.grid-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.mini {
  display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 76px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; text-decoration: none; color: var(--navy);
}
.mini:hover { color: var(--navy); }
.mini-ic { width: 46px; height: 46px; border-radius: 12px; background: var(--navy); color: var(--on-dark); display: grid; place-items: center; flex: none; }
.mini-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
.mini-sub { font-size: 13px; color: var(--muted); }

.prevnext { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.pn {
  display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; background: var(--card);
  border: 1.5px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--navy);
}
.pn:hover { color: var(--navy); }
.pn-next { text-align: right; align-items: flex-end; }
.pn-dir { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--blue); }
.pn-name { font-size: 17px; font-weight: 600; }

/* À emporter */
.takeaway { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.howto { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.howto div { padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.howto dt { font-weight: 600; color: var(--navy); font-size: 15px; }
.howto dd { margin: 2px 0 0; font-size: 15px; line-height: 1.55; }
.qr {
  width: 180px; max-width: 100%; aspect-ratio: 1; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
  display: grid; place-items: center; overflow: hidden; padding: 6px; flex: none;
}
.qr svg { width: 100%; height: 100%; display: block; }
.qr-lg { width: 220px; }
.qr-off { font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; padding: 10px; }
.copybox { display: flex; flex-wrap: wrap; gap: 8px; }
.copybox input {
  flex: 1 1 220px; min-width: 0; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 14px;
}
.take-panel { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; }
.take-text { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.take-text h2 { font-size: clamp(20px, 2.6vw, 24px); font-weight: 700; }
.done { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; }

.grid-fav { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.fcard { display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); min-width: 0; }
.fcard-head { display: flex; align-items: center; gap: 14px; }
.fcard-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fcard-meta { font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--violet); }
.fcard h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
.fcard h3 a { color: var(--navy); text-decoration: none; }
.fcard h3 a:hover { text-decoration: underline; }
.fcard > p { font-size: 15px; line-height: 1.6; }
.fcard-real h4 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.fcard-real ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fcard-real li { display: flex; flex-direction: column; font-size: 14.5px; line-height: 1.45; padding-left: 14px; border-left: 2px solid var(--line); }
.fcard-real li strong { font-weight: 600; color: var(--navy); }
.fcard-real li span { font-size: 13px; color: var(--muted); }
.fcard .btn-outline { align-self: flex-start; margin-top: auto; }
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--violet); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn:hover { border-color: var(--violet); }
.empty { align-items: flex-start; max-width: 640px; }
.empty-ic { width: 56px; height: 56px; border-radius: 16px; background: var(--bg); color: var(--violet); display: grid; place-items: center; }
.empty h2 { font-size: 22px; }
.clear-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-radius: var(--radius); border: 1.5px dashed var(--line); }
.clear-box p { color: var(--muted); font-size: 15px; }
.clear-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Espace formateur */
.h-panel { font-size: 20px; font-weight: 700; }
.url-form { display: flex; flex-direction: column; gap: 8px; }
.url-form label { font-weight: 600; color: var(--navy); font-size: 15px; }
.url-row { display: flex; flex-wrap: wrap; gap: 8px; }
.url-row input {
  flex: 1 1 260px; min-width: 0; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--text); font: inherit; font-size: 15px;
}
.url-row input:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; }
.form-msg { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.table-wrap { overflow-x: auto; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--bg); }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; color: var(--violet); font-weight: 700; }
.note p { color: var(--muted); font-size: 15px; }

/* Pied de page et message */
.site-footer { background: var(--navy); color: var(--on-dark); }
.footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 22px; }
.site-footer p { font-size: 14px; line-height: 1.6; max-width: 70ch; }
.site-footer a { display: inline-flex; align-items: center; min-height: 44px; color: var(--on-dark); font-size: 14px; font-weight: 600; }
.site-footer a:hover { color: var(--on-dark); text-decoration: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px; background: var(--navy); color: var(--on-dark);
  font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

@media (prefers-reduced-motion: no-preference) {
  #app > * { animation: rise 0.28s ease-out both; }
  #app.no-anim > * { animation: none; }
  .pop svg { animation: pop 0.32s ease-out; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); } }
}
@media (prefers-reduced-motion: reduce) {
  .lift { transition: none; }
  .lift:hover { transform: none; }
  html { scroll-behavior: auto; }
}

@media print {
  body::before, .site-header, .site-footer, .toast, .skip, .no-print, .btn-fav, .btn-outline, .btn, .pager, .back, .icon-btn, .mosaic { display: none !important; }
  body { background: #ffffff; }
  .hero, .subhero, .fiche-hero { background: #ffffff !important; color: #000000; }
  .hero h1, .subhero h1, .fiche-hero h1, .hero *, .subhero *, .fiche-hero * { color: #000000 !important; }
  .panel, .rcard, .mcard, .fcard, .tile { break-inside: avoid; box-shadow: none; }
  #app > * { animation: none !important; }
}

  var TOTAL_REAL = 0;
  MACHINES.forEach(function (m, i) {

    SECTEURS_BY_ID[s.id] = s;

  /* Outils */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var NB = " ";
  function t(s) {
    return esc(String(s).replace(/ ([?:!;»])/g, NB + "$1").replace(/« /g, "«" + NB).replace(/(\d) (°C|V|m)\b/g, "$1" + NB + "$2"));
  }
  function plural(n, un, plusieurs) { return n + " " + (n > 1 ? plusieurs : un); }
  function svg(name, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + ICONS[name] + "</svg>";

  function savedUrl() { try { return localStorage.getItem(URL_KEY) || ""; } catch (e) { return ""; } }
  function baseUrl() {
    var saved = savedUrl();
    if (saved) return saved;
    try {
      var u = new URL(location.href);
      if (/^https?:$/.test(u.protocol) && !/(claude|anthropic|usercontent|localhost|127\.0\.0\.1)/i.test(u.hostname)) {
        return u.origin + u.pathname;
      }
    } catch (e) {}
    return URL_PUBLIQUE;

  function selectionUrl(ids) {
    return ids.length === 1 ? baseUrl() + "#machine-" + ids[0] : baseUrl() + "#selection-" + ids.join("-");
  }

  /* Routes : #accueil, #machine-laser, #secteur-construction, #favoris, #selection-laser-cnc, #formateur */
  function parseRoute() {
    var h = "";
    try { h = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (e) { h = ""; }
    var m;
    if (!h || h === "accueil") return { view: "home" };
    if (h === "favoris") return { view: "favoris" };
    if (h === "formateur") return { view: "formateur" };
    if ((m = h.match(/^machine-([a-z0-9]+)$/)) && MACHINES_BY_ID[m[1]]) return { view: "machine", id: m[1] };
    if ((m = h.match(/^secteur-([a-z0-9]+)$/)) && SECTEURS_BY_ID[m[1]]) return { view: "secteur", id: m[1] };
    if ((m = h.match(/^selection-([a-z0-9-]+)$/))) {
      var ids = [];
      m[1].split("-").forEach(function (id) { if (MACHINES_BY_ID[id] && ids.indexOf(id) === -1) ids.push(id); });
      if (ids.length === 1) return { view: "machine", id: ids[0] };
      if (ids.length > 1) return { view: "selection", ids: ids };
    }
    return { view: "home" };
  }

  var qrState = "idle", qrWaiters = [];
  function ensureQr(cb) {
    if (typeof window.qrcode === "function") { qrState = "ready"; cb(); return; }
    if (qrState === "failed") { cb(); return; }
    qrWaiters.push(cb);
    if (qrState === "loading") return;
    qrState = "loading";
    var s = document.createElement("script");
    s.src = QR_LIB;
    s.async = true;
    s.onload = function () { qrState = typeof window.qrcode === "function" ? "ready" : "failed"; flushQr(); };
    s.onerror = function () { qrState = "failed"; flushQr(); };
    (document.head || document.documentElement).appendChild(s);
  }
  function flushQr() { var w = qrWaiters; qrWaiters = []; w.forEach(function (f) { f(); }); }
  function qrSvg(text) {
    try {
      var qr = window.qrcode(0, "M");
      qr.addData(text);
      qr.make();
      var n = qr.getModuleCount(), q = 4, size = n + q * 2, d = "";
      for (var r = 0; r < n; r++) {
        for (var c = 0; c < n; c++) {
          if (qr.isDark(r, c)) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
        }
      }
      return '<svg viewBox="0 0 ' + size + " " + size + '" role="img" aria-label="QR code vers ' + esc(text) + '" shape-rendering="crispEdges"><rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path d="' + d + '" fill="#2f3a48"/></svg>';
    } catch (e) { return ""; }
  }
  function fillQrs() {
    var boxes = Array.prototype.slice.call(app.querySelectorAll("[data-qr]"));
    if (!boxes.length) return;
    ensureQr(function () {
      boxes.forEach(function (b) {
        var out = qrState === "ready" ? qrSvg(b.getAttribute("data-qr")) : "";
        b.innerHTML = out || '<span class="qr-off">Le QR code ne peut pas s' + "'" + "afficher. Utilise le lien.</span>";
      });
    });
  }

  /* Message bref */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2400);
  }

  function copyText(text, btn) {
    function fallback() {
      var box = btn && btn.closest("[data-copy-box]");
      var input = box && box.querySelector("input");
      if (input) {
        input.focus();
        input.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        toast(ok ? "Lien copié" : "Le lien est sélectionné : copie-le");
      } else {
        toast("Copie impossible ici");
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Lien copié"); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareLink(url, btn) {
    if (!canShare) { copyText(url, btn); return; }
    try {
      navigator.share({ title: "Machines de la Digital Factory", url: url }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        copyText(url, btn);
      });
    } catch (e) { copyText(url, btn); }
  }

  /* Rendu */
  var app = document.getElementById("app");
  var favs = loadFavs();
  var lastKey = null;
  var TITRES = { home: "Machines de la Digital Factory", favoris: "Mes favoris · Machines DF", formateur: "Espace formateur · Machines DF", selection: "Sélection · Machines DF" };

  function updateCount() {
    var c = document.getElementById("fav-count");
    c.textContent = String(favs.length);
    c.hidden = favs.length === 0;
    var link = document.querySelector('[data-nav="favoris"]');
    if (link) link.setAttribute("aria-label", favs.length ? "Mes favoris, " + plural(favs.length, "machine", "machines") : "Mes favoris");
  }
  function setNavCurrent(view) {
    var map = { home: "home", favoris: "favoris" };
    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (a) {
      if (a.getAttribute("data-nav") === map[view]) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }
  function render(opts) {
    opts = opts || {};
    var r = parseRoute();
    var key = r.view + ":" + (r.id || (r.ids || []).join("-"));
    if (key !== lastKey) clearAsk = false;
    var html;
    if (r.view === "machine") html = viewMachine(r.id);
    else if (r.view === "secteur") html = viewSecteur(r.id);
    else if (r.view === "favoris") html = viewFavoris();
    else if (r.view === "selection") html = viewSelection(r.ids);
    else if (r.view === "formateur") html = viewFormateur();
    else html = viewHome();
    var y = window.scrollY || 0;
    app.classList.toggle("no-anim", !!opts.keepScroll);
    app.innerHTML = html;
    setNavCurrent(r.view);
    fillQrs();
    if (r.view === "machine") document.title = MACHINES_BY_ID[r.id].nom + " · Machines DF";
    else if (r.view === "secteur") document.title = SECTEURS_BY_ID[r.id].nom + " · Machines DF";
    else document.title = TITRES[r.view] || TITRES.home;
    if (opts.keepScroll) {
      window.scrollTo(0, y);
    } else {
      window.scrollTo(0, 0);
      if (lastKey !== null) {
        var h1 = app.querySelector("h1");
        if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); } }
      }
    }
    if (r.view === "secteur") {
      var chips = app.querySelector(".chips");
      var cur = app.querySelector('.chip[aria-current="page"]');
      if (chips && cur && chips.scrollWidth > chips.clientWidth) {
        chips.scrollLeft = Math.max(0, cur.offsetLeft - chips.offsetLeft - (chips.clientWidth - cur.offsetWidth) / 2);
      }
    }
    lastKey = key;
  }

  function toggleFav(id) {
    if (!MACHINES_BY_ID[id]) return;
    var was = isFav(id);
    favs = was ? favs.filter(function (x) { return x !== id; }) : favs.concat(id);
    saveFavs();
    updateCount();
    toast(was ? "Retiré de tes favoris" : "Ajouté à tes favoris");
    var view = parseRoute().view;
    if (view === "favoris" || view === "selection") { render({ keepScroll: true }); return; }
    Array.prototype.forEach.call(document.querySelectorAll('[data-action="fav"][data-id="' + id + '"]'), function (b) {
      var on = !was;
      b.setAttribute("aria-pressed", String(on));
      if (b.classList.contains("btn-fav")) b.innerHTML = favInner(on);
      b.classList.remove("pop");
      void b.offsetWidth;
      b.classList.add("pop");
    });
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!el) return;
    var a = el.getAttribute("data-action");
    if (a === "fav") toggleFav(el.getAttribute("data-id"));
    else if (a === "copy") copyText(el.getAttribute("data-text"), el);
    else if (a === "share") shareLink(el.getAttribute("data-text"), el);
    else if (a === "jump") {
      var target = document.getElementById(el.getAttribute("data-target"));
      if (target) target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    } else if (a === "add-all") {
      el.getAttribute("data-ids").split("-").forEach(function (id) { if (MACHINES_BY_ID[id] && !isFav(id)) favs.push(id); });
      saveFavs();
      updateCount();
      toast("Ajouté à tes favoris");
      render({ keepScroll: true });
    } else if (a === "clear-ask") { clearAsk = true; render({ keepScroll: true }); }
    else if (a === "clear-cancel") { clearAsk = false; render({ keepScroll: true }); }
    else if (a === "clear-confirm") {
      favs = [];
      clearAsk = false;
      saveFavs();
      updateCount();
      toast("Sélection vidée");
      render({ keepScroll: true });
    } else if (a === "reset-url") {
      try { localStorage.removeItem(URL_KEY); } catch (err) {}
      toast("Adresse par défaut rétablie");
      render({ keepScroll: true });
    } else if (a === "skip") {
      app.focus();
    }
  });

  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form || form.getAttribute("data-form") !== "adresse") return;
    e.preventDefault();
    var input = form.querySelector("#adresse");
    var msg = form.querySelector("#adresse-msg");
    var val = (input.value || "").trim();
    if (!val) {
      try { localStorage.removeItem(URL_KEY); } catch (err) {}
      toast("Adresse par défaut rétablie");
      render({ keepScroll: true });
      return;
    }
    var u;
    try { u = new URL(val); } catch (err) { u = null; }
    if (!u || !/^https?:$/.test(u.protocol)) {
      msg.textContent = "Écris une adresse complète qui commence par https://";
      input.focus();
      return;
    }
    var clean = u.origin + u.pathname;
    var ok = true;
    try { localStorage.setItem(URL_KEY, clean); } catch (err) { ok = false; }
    if (!ok) { msg.textContent = "Ce réglage ne peut pas être gardé sur cet appareil."; return; }
    toast("Adresse enregistrée");
    render({ keepScroll: true });
  });

  window.addEventListener("hashchange", function () { render(); });

  legacyParam();
  updateCount();
  render();
})();
</script>
</body>
</html>
